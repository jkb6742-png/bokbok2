<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
.prompt{display:flex;justify-content:center;margin:-6px 0 20px}
.prompt div{background:#fff;border:2.5px solid var(--ink);border-radius:22px 22px 22px 4px;padding:12px 22px;font-family:'Gaegu';font-weight:700;font-size:26px}
.prompt span{color:var(--sub);font-size:21px;margin-right:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.panel{border:3px solid var(--ink);border-radius:14px;overflow:hidden;background:#fff;position:relative}
.panel svg{display:block;width:100%;height:auto}
.panel .bt{position:absolute;height:auto}
.bt{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-family:'Gaegu';font-weight:700;font-size:23px;line-height:1.22;padding:6px 12px;color:var(--ink)}
</style></head><body>
<div id="app"></div>
<script src="data.js"></script><script src="head.js"></script><script src="comic.js"></script>
<script>
const P = (inner, bg) => {
  const pct = v => (v / 380 * 100) + '%';
  const labs = C.labels.map(l => `<div class="bt" style="left:${pct(l.x)};top:${pct(l.y)};width:${pct(l.w)};height:${pct(l.h)};${l.style}">${l.html}</div>`).join('');
  C.labels = [];
  return `<div class="panel"><svg viewBox="0 0 380 380" xmlns="http://www.w3.org/2000/svg"><rect width="380" height="380" fill="${bg}"/>${inner}</svg>${labs}</div>`;
};
const c = D.comic;
const panels = c.panels.map((p, i) => P(`
  ${C.person({x: 118, y: 262, s: .95, body: p.body, hair: p.hair, hairStyle: p.hairStyle, glasses: p.glasses, face: p.face, arm: p.arm})}
  <rect x="270" y="14" width="96" height="36" rx="18" fill="${p.body}"/>
  <text x="318" y="40" text-anchor="middle" font-family="Jua" font-size="24" fill="#fff">${p.type}</text>
  ${C.bubble(16, 62, 348, 112, p.say, [118, 204], {style: p.sayStyle || ''})}
  ${C.label(206, 236, 166, 116, p.cap, 'font-size:20px;color:var(--sub)')}
  ${C.badge(i + 1)}`, i === 1 || i === 2 ? 'var(--acc-soft)' : '#fff')).join('');
document.getElementById('app').innerHTML = H(c.t, c.b, c.d) +
  `<div class="prompt"><div><span>${c.who}</span>${c.q}</div></div><div class="grid">${panels}</div>` + FOOT;
</script></body></html>
